<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="60%" stop-color="#121a36"/>
      <stop offset="100%" stop-color="#14334a"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>

  <!-- waveform: candidate audio (green) and bot voice (purple) -->
  <g stroke-linecap="round" stroke-width="7" opacity="0.6">
    <g stroke="#34d399">
      <line x1="780" y1="150" x2="780" y2="170"/><line x1="800" y1="135" x2="800" y2="185"/>
      <line x1="820" y1="120" x2="820" y2="200"/><line x1="840" y1="140" x2="840" y2="180"/>
      <line x1="860" y1="105" x2="860" y2="215"/><line x1="880" y1="128" x2="880" y2="192"/>
      <line x1="900" y1="145" x2="900" y2="175"/><line x1="920" y1="118" x2="920" y2="202"/>
      <line x1="940" y1="138" x2="940" y2="182"/><line x1="960" y1="152" x2="960" y2="168"/>
    </g>
    <g stroke="#a78bfa">
      <line x1="1010" y1="148" x2="1010" y2="172"/><line x1="1030" y1="125" x2="1030" y2="195"/>
      <line x1="1050" y1="110" x2="1050" y2="210"/><line x1="1070" y1="132" x2="1070" y2="188"/>
      <line x1="1090" y1="98" x2="1090" y2="222"/><line x1="1110" y1="126" x2="1110" y2="194"/>
      <line x1="1130" y1="142" x2="1130" y2="178"/><line x1="1150" y1="120" x2="1150" y2="200"/>
      <line x1="1170" y1="146" x2="1170" y2="174"/><line x1="1190" y1="154" x2="1190" y2="166"/>
    </g>
  </g>

  <!-- logo: microphone -->
  <rect x="72" y="72" width="64" height="64" rx="16" fill="url(#logo)"/>
  <rect x="96" y="84" width="16" height="28" rx="8" fill="#ffffff"/>
  <path d="M88 104 a16 16 0 0 0 32 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="104" y1="120" x2="104" y2="127" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <text x="156" y="118" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Meeting Intelligence <tspan fill="#86efac">Agent</tspan></text>
  <text x="74" y="186" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1e3">Live meeting notes · AI interview assistant · voice bot interviewer</text>
  <text x="74" y="218" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8a95ad">Any meeting app · local Whisper transcription · evidence-checked AI · works in Google Meet</text>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="74" y="246" width="104" height="30" rx="15" fill="#9b8afb" fill-opacity="0.18" stroke="#9b8afb" stroke-opacity="0.5"/>
    <text x="126" y="266" text-anchor="middle" fill="#d6ceff">LangGraph</text>
    <rect x="188" y="246" width="84" height="30" rx="15" fill="#9b8afb" fill-opacity="0.18" stroke="#9b8afb" stroke-opacity="0.5"/>
    <text x="230" y="266" text-anchor="middle" fill="#d6ceff">Claude</text>
    <rect x="282" y="246" width="96" height="30" rx="15" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="330" y="266" text-anchor="middle" fill="#bbf7d0">Whisper</text>
    <rect x="388" y="246" width="92" height="30" rx="15" fill="#4f8cff" fill-opacity="0.15" stroke="#4f8cff" stroke-opacity="0.5"/>
    <text x="434" y="266" text-anchor="middle" fill="#c4d8ff">FastAPI</text>
    <rect x="490" y="246" width="116" height="30" rx="15" fill="#4f8cff" fill-opacity="0.15" stroke="#4f8cff" stroke-opacity="0.5"/>
    <text x="548" y="266" text-anchor="middle" fill="#c4d8ff">WASAPI audio</text>
    <rect x="616" y="246" width="96" height="30" rx="15" fill="#4f8cff" fill-opacity="0.15" stroke="#4f8cff" stroke-opacity="0.5"/>
    <text x="664" y="266" text-anchor="middle" fill="#c4d8ff">Python</text>
  </g>
</svg>
